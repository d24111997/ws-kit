name: leak-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pattern guard (project-leak refs)
        run: |
          # Danh sách từ khoá để dạng base64: nếu viết nguyên văn, chính file này chứa
          # chuỗi cần chặn nên sẽ tự khớp và job fail trên mọi nhánh (self-match).
          # Giải mã để giữ nguyên hành vi quét toàn bộ repo, không loại trừ file nào.
          PATTERN=$(printf '%s' 'RUNHfElubmdvfEFuaWpvYnxBSkpPQnxjdl9leHRyYWN0fGZlX29wc3xmZV9jdnxkdW5ncGhhbXwxMFwuVXRpbF9TY3JpcHRzfHByaiBbMC05XQ==' | base64 -d)
          if grep -rInE "$PATTERN" --exclude-dir=.git . ; then
            echo "::error::Forbidden leak pattern found in repo"; exit 1
          else
            echo "OK: no forbidden patterns"
          fi
